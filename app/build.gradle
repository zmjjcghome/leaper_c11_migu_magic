plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leapermagic.magic'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    
    defaultConfig {
        applicationId "com.leapermagic.magic"
        minSdk 28
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    // 新增下面这段资源打包规则
    packagingOptions {
        resources {
            excludes += "/META-INF/versions/9/OSGI-INF/MANIFEST.MF"
            // 额外补充排除Bouncy Castle系列常见冗余重复清单，避免后续编译再出现同类冲突
            excludes += "/META-INF/BC*.SF"
            excludes += "/META-INF/BC*.DSA"
            excludes += "/META-INF/BC*.RSA"
            excludes += "/META-INF/LICENSE"
            excludes += "/META-INF/LICENSE.txt"
            excludes += "/META-INF/NOTICE"
            excludes += "/META-INF/NOTICE.txt"
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.android.tools.build:apksig:8.2.2'
    // implementation 'com.android.tools.build:apksig:8.0.2'
    // BouncyCastle 证书生成库（用于无 keystore 时自动安全生成证书）
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'com.github.vidstige:jadb:v1.3.0'

}
