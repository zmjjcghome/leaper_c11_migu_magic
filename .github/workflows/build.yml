name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
  #pull_request:
    #branches: [ main, master ]
  workflow_dispatch:            # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release.apk
          path: app/build/outputs/apk/release/app-release.apk
      
      - name: Upload firmware to wormhole.app
        run: |
          ls -l

          cargo install --git https://github.com/trumank/wormhole-cli.git
          wormhole-cli upload app/build/outputs/apk/release/app-release.apk 2>&1 | tee wormhole.app.log
          echo "::warning file=wormhole.app::$(cat wormhole.app.log | grep https://wormhole.app)"
          
