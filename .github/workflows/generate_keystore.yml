name: Generate Keystore Asset

on:
  #push:
  #  branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Android-compatible PKCS12 Keystore using keytool
        run: |
          mkdir -p app/src/main/assets
          # 关键：先删除已存在的旧密钥库文件，防止别名重复报错
          rm -f app/src/main/assets/autosign.p12
          
          # 使用明确兼容 Android apksig 的参数生成 p12
          keytool -J-Dkeystore.pkcs12.legacy \
            -genkeypair -v \
            -alias autosign_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -sigalg SHA256withRSA \
            -keystore app/src/main/assets/autosign.p12 \
            -storetype PKCS12 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=AutoSign, OU=Dev, O=AutoSign, C=CN"
          #keytool -J-Dkeystore.pkcs12.legacy -genkeypair -v -storetype PKCS12 -keystore autosign.p12 -alias autosign_alias -keyalg RSA -keysize 2048 -validity 10000 -storepass changeit -keypass changeit -dname "CN=AutoSign, OU=Dev, O=Magic, L=Beijing, ST=Beijing, C=CN"
  
          echo "✅ 成功生成 Android 兼容的 autosign.p12 密钥库"

      - name: Commit and push keystore to assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate Android-compatible p12 keystore"
          file_pattern: "app/src/main/assets/autosign.p12"
