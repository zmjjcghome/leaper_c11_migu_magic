name: Build Rust Cert Generator

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-cert-generator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build for Android ABIs
        working-directory: rust-cert-generator
        run: |
            export CARGO_NDK_PLATFORM=21
            cargo ndk -t armeabi-v7a -t arm64-v8a -t x86_64 build --release

      name: Build Rust Cert Generator

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-cert-generator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v2
        id: setup-ndk
        with:
          ndk-version: r26b
          local-cache: true

      - name: Build for Android ABIs
        working-directory: rust-cert-generator
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          mkdir -p .cargo
          cat << EOF > .cargo/config.toml
          [target.armv7-linux-androideabi]
          linker = "$TOOLCHAIN_BIN/armv7a-linux-androideabi21-clang"
          ar = "$TOOLCHAIN_BIN/llvm-ar"

          [target.aarch64-linux-android]
          linker = "$TOOLCHAIN_BIN/aarch64-linux-android21-clang"
          ar = "$TOOLCHAIN_BIN/llvm-ar"

          [target.x86_64-linux-android]
          linker = "$TOOLCHAIN_BIN/x86_64-linux-android21-clang"
          ar = "$TOOLCHAIN_BIN/llvm-ar"

          [env]
          AR_armv7_linux_androideabi = "$TOOLCHAIN_BIN/llvm-ar"
          CC_armv7_linux_androideabi = "$TOOLCHAIN_BIN/armv7a-linux-androideabi21-clang"
          
          AR_aarch64_linux_android = "$TOOLCHAIN_BIN/llvm-ar"
          CC_aarch64_linux_android = "$TOOLCHAIN_BIN/aarch64-linux-android21-clang"
          
          AR_x86_64_linux_android = "$TOOLCHAIN_BIN/llvm-ar"
          CC_x86_64_linux_android = "$TOOLCHAIN_BIN/x86_64-linux-android21-clang"
          EOF

          cargo build --target armv7-linux-androideabi --release
          cargo build --target aarch64-linux-android --release
          cargo build --target x86_64-linux-android --release

      - name: Copy binaries to Android jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64

          cp rust-cert-generator/target/armv7-linux-androideabi/release/cert_generator app/src/main/jniLibs/armeabi-v7a/libcert_generator.so
          cp rust-cert-generator/target/aarch64-linux-android/release/cert_generator app/src/main/jniLibs/arm64-v8a/libcert_generator.so
          cp rust-cert-generator/target/x86_64-linux-android/release/cert_generator app/src/main/jniLibs/x86_64/libcert_generator.so

      - name: Commit and push compiled jniLibs back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update compiled Rust binaries in jniLibs"
          file_pattern: "app/src/main/jniLibs/"
