name: Build Rust Cert Generator

on:
  push:
    branches: [ main, master ]
    paths:
      - 'rust-cert-generator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Android targets
        run: |
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android

      - name: Install Android NDK
        uses: nttld/setup-ndk@v2
        id: setup-ndk
        with:
          ndk-version: r26b
          local-cache: true

      - name: Build for Android ABIs
        working-directory: rust-cert-generator
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 自动获取 NDK 的工具链路径和 Clang 目标
          # 针对 armeabi-v7a (API 21)
          CC_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          AR_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          # 针对 arm64-v8a (API 21)
          CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          
          # 针对 x86_64 (API 21)
          CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

          # 写入 cargo config.toml 使得编译时自动应用链接器
          mkdir -p .cargo
          cat << EOF > .cargo/config.toml
          [target.armv7-linux-androideabi]
          linker = "$CC_armv7_linux_androideabi"
          ar = "$AR_armv7_linux_androideabi"

          [target.aarch64-linux-android]
          linker = "$CC_aarch64_linux_android"
          ar = "$AR_aarch64_linux_android"

          [target.x86_64-linux-android]
          linker = "$CC_x86_64_linux_android"
          ar = "$AR_x86_64_linux_android"
          EOF

          # 执行全架构编译
          cargo build --target armv7-linux-androideabi --release
          cargo build --target aarch64-linux-android --release
          cargo build --target x86_64-linux-android --release

      - name: Copy binaries to Android Assets
        run: |
          mkdir -p app/src/main/assets/bin/armeabi-v7a
          mkdir -p app/src/main/assets/bin/arm64-v8a
          mkdir -p app/src/main/assets/bin/x86_64

          cp rust-cert-generator/target/armv7-linux-androideabi/release/cert_generator app/src/main/assets/bin/armeabi-v7a/
          cp rust-cert-generator/target/aarch64-linux-android/release/cert_generator app/src/main/assets/bin/arm64-v8a/
          cp rust-cert-generator/target/x86_64-linux-android/release/cert_generator app/src/main/assets/bin/x86_64/

          chmod +x app/src/main/assets/bin/armeabi-v7a/cert_generator
          chmod +x app/src/main/assets/bin/arm64-v8a/cert_generator
          chmod +x app/src/main/assets/bin/x86_64/cert_generator

      - name: Commit and push compiled assets back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update compiled Rust binaries in assets"
          file_pattern: "app/src/main/assets/bin/"
